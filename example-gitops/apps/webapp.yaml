apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webapp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://chartmuseum.cicd.svc.cluster.local:8080
    chart: webapp
    targetRevision: "0.1.0"
    helm:
      values: |
        imagePullSecrets:
          - name: harbor-pull-webapps
  destination:
    server: https://kubernetes.default.svc
    namespace: webapps
  syncPolicy:
    automated:
      selfHeal: true
      prune: false
    syncOptions:
      - CreateNamespace=true
