# SA para os pods de Workflow do Argo (executor emissary precisa gravar
# workflowtaskresults; escopo minimo, ver design.md D3)
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workflow
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workflow-results
  namespace: cicd
rules:
  - apiGroups: [argoproj.io]
    resources: [workflowtaskresults]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workflow-results
  namespace: cicd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workflow-results
subjects:
  - kind: ServiceAccount
    name: workflow
    namespace: cicd
