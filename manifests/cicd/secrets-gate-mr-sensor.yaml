# Sensor do gate de Merge Requests (change mr-security-gate + mr-llm-code-review)
# Recebe o payload de MR do GitLab (via rota /mr do EventSource
# secrets-gate), filtra as acoes relevantes e dispara DOIS Workflows em
# paralelo: gitleaks-scan (gate bloqueante) e mr-code-review (review LLM).
# O payload do webhook EventSource chega como {header, body, metadata};
# o body do GitLab e JSON cru (gjson paths abaixo).
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: secrets-gate-mr
  namespace: cicd
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: mr-event
      eventSourceName: secrets-gate
      eventName: secrets-gate-mr
      # Filtro por expressao: apenas abertura/reabertura/atualizacao de MR
      # dispara os fluxos. ExprFilter = expr + fields (nome -> gjson path do
      # payload); avaliado com govaluate (sem operador 'in').
      filters:
        exprs:
          - expr: "kind == 'merge_request' && (action == 'open' || action == 'reopen' || action == 'update')"
            fields:
              - path: body.object_kind
                name: kind
              - path: body.object_attributes.action
                name: action
  triggers:
    # Trigger 1: security gate (gitleaks, bloqueante)
    - template:
        name: gitleaks-mr-workflow
        conditions: mr-event
        argoWorkflow:
          operation: submit
          # Os parameters do trigger argoWorkflow ficam DENTRO de
          # argoWorkflow (o campo no nivel do trigger e ignorado).
          parameters:
            - src:
                dependencyName: mr-event
                # |- para NAO incluir o newline no valor renderizado
                dataTemplate: |-
                  http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/{{ .Input.body.project.path_with_namespace }}.git
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: mr-event
                dataKey: body.object_attributes.last_commit.id
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: mr-event
                dataKey: body.object_attributes.iid
              dest: spec.arguments.parameters.2.value
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: gitleaks-scan-
              spec:
                arguments:
                  parameters:
                    - name: repo_url
                      value: ""
                    - name: sha
                      value: ""
                    - name: mr_iid
                      value: ""
                workflowTemplateRef:
                  name: gitleaks-scan
      retryStrategy:
        steps: 3
    # Trigger 2: code review por LLM (change mr-llm-code-review, consultivo
    # exceto severity critical)
    - template:
        name: mr-code-review
        conditions: mr-event
        argoWorkflow:
          operation: submit
          parameters:
            - src:
                dependencyName: mr-event
                dataTemplate: |-
                  http://gitlab-webservice-default.gitlab.svc.cluster.local:8181/{{ .Input.body.project.path_with_namespace }}.git
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: mr-event
                dataKey: body.object_attributes.source_branch
              dest: spec.arguments.parameters.1.value
            - src:
                dependencyName: mr-event
                dataKey: body.object_attributes.iid
              dest: spec.arguments.parameters.2.value
            - src:
                dependencyName: mr-event
                dataKey: body.project.id
              dest: spec.arguments.parameters.3.value
            - src:
                dependencyName: mr-event
                dataKey: body.object_attributes.last_commit.id
              dest: spec.arguments.parameters.4.value
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: mr-code-review-
              spec:
                arguments:
                  parameters:
                    - name: repo_url
                      value: ""
                    - name: source_branch
                      value: ""
                    - name: mr_iid
                      value: ""
                    - name: project_id
                      value: ""
                    - name: sha
                      value: ""
                workflowTemplateRef:
                  name: mr-code-review
      retryStrategy:
        steps: 3
