# RBAC dos job pods do runner (executor kubernetes, design D3)
# A ServiceAccount permite que o job de gate consulte o status dos
# Workflows do Argo via API do Kubernetes, sem credenciais extras, e que
# o job de assinatura (change image-signing-enforcement) leia apenas o
# Secret cosign-key-pair via provider k8s:// do cosign.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-runner-job
  namespace: cicd
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-runner-job
  namespace: cicd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["workflows"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cosign-key-pair"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-runner-job
  namespace: cicd
subjects:
  - kind: ServiceAccount
    name: gitlab-runner-job
    namespace: cicd
roleRef:
  kind: Role
  name: gitlab-runner-job
  apiGroup: rbac.authorization.k8s.io
