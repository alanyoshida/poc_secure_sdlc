# EventSource webhook do gate de secrets (design.md D4)
# O controller cria o Service <nome>-eventsource-svc expondo a porta 12000;
# o job de gate do GitLab CI faz POST /gate com payload {repo_url, sha}.
apiVersion: argoproj.io/v1alpha1
kind: EventSource
metadata:
  name: secrets-gate
  namespace: cicd
spec:
  service:
    ports:
      - port: 12000
        targetPort: 12000
        protocol: TCP
  webhook:
    secrets-gate:
      port: "12000"
      endpoint: /gate
      method: POST
      # auth na PoC: restrito ao trafego in-cluster (sem token no webhook;
      # o endpoint nao e exposto fora do namespace)
