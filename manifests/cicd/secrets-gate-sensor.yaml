# Sensor que instancia o WorkflowTemplate gitleaks-scan a partir do payload
# {repo_url, sha} do webhook (design.md D4)
apiVersion: argoproj.io/v1alpha1
kind: Sensor
metadata:
  name: secrets-gate
  namespace: cicd
spec:
  template:
    serviceAccountName: operate-workflow-sa
  dependencies:
    - name: gate-event
      eventSourceName: secrets-gate
      eventName: secrets-gate
  triggers:
    - template:
        name: gitleaks-workflow
        conditions: gate-event
        argoWorkflow:
          operation: submit
          # O payload do webhook chega como {header, body, metadata}; o body
          # JSON cru do POST fica sob "body" (gjson path). Os parameters do
          # trigger argoWorkflow ficam DENTRO de argoWorkflow (e nao no nivel
          # do trigger - o controller ignora o campo no nivel superior).
          parameters:
            - src:
                dependencyName: gate-event
                dataKey: body.repo_url
              dest: spec.arguments.parameters.0.value
            - src:
                dependencyName: gate-event
                dataKey: body.sha
              dest: spec.arguments.parameters.1.value
          source:
            resource:
              apiVersion: argoproj.io/v1alpha1
              kind: Workflow
              metadata:
                generateName: gitleaks-scan-
              spec:
                arguments:
                  parameters:
                    - name: repo_url
                      value: ""
                    - name: sha
                      value: ""
                workflowTemplateRef:
                  name: gitleaks-scan
      retryStrategy:
        steps: 3
      retryStrategy:
        steps: 3
